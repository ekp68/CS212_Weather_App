<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title work in progress -->
    <title>Weather Application</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body id="app-body" class="default-bg">

    <div class="container text-center mt-5">

        <h1 class="mb-4">Weather Dashboard</h1>

        <!-- LOCATION INPUT (Evan) -->
        <form>
            <div class="input-group mb-4">
                <input type="text" id="locationInput" class="form-control" placeholder="Enter city...">
                <button class="btn btn-primary" id="searchBtn">Search</button>
            </div>
        </form>
        

        <!-- CURRENT WEATHER DISPLAY (Nick) -->
        <div id="weatherCard" class="card p-4 shadow">
            <h1 id="cityName">City Name</h1>
            <h2><span id="temperature">--</span> °F</h2>
            <h4><span id="sky">--</span></h4>
            
            <!-- WEATHER ICON (Jacob) -->
            <img id="weatherIcon" src="" alt="Weather Icon" class="my-2">

            <!-- WEATHER DETAILS (James) -->
            <div class="mt-3">
                <div class="row text-center">
                    <div class="col-6 col-md-4 mb-2">
                        <strong>Humidity:</strong><br>
                        <span id="humidity">--</span>%
                    </div>

                    <div class="col-6 col-md-4 mb-2">
                        <strong>Feels Like:</strong><br>
                        <span id="feels-like">--</span> °F
                    </div>

                    <div class="col-6 col-md-4 mb-2">
                        <strong>Wind Speed:</strong><br>
                        <span id="wind">--</span> mph
                    </div>
            
                    <div class="col-6 col-md-4 mb-2">
                        <strong>Visibility:</strong><br>
                        <span id="visibility">--</span> miles
                    </div>
            
                    <div class="col-6 col-md-4 mb-2">
                        <strong>UV Index:</strong><br>
                        <span id="uv">--</span>
                    </div>
            
                    <div class="col-6 col-md-4 mb-2">
                        <strong>Air Quality:</strong><br>
                        <span id="air-quality">--</span>
                    </div>
            
                    <div>
                        <strong>Precipitation:</strong><br>
                        <span id="precipitation">--</span> in
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- App JS -->
    <script src="app.js"></script>

</body>

</html>
