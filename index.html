<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title work in progress -->
    <title>Weather Application</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body id="app-body" class="default-bg">

    <div class="container text-center mt-5">

        <h1 class="mb-4">Weather Dashboard</h1>

        <!-- LOCATION INPUT (Evan) -->
        <form>
            <div class="input-group mb-4">
                <input type="text" id="locationInput" class="form-control" placeholder="Enter city...">
                <button class="btn btn-primary" id="searchBtn">Search</button>
            </div>
        </form>
        

        <!-- CURRENT WEATHER DISPLAY (Nick) -->
        <div id="weatherCard" class="card p-4 shadow">
            <h2 id="cityName">City Name</h2>
            <h3 id="temperature">-- °F</h3>
            <p id="description">Weather description</p>

            <!-- WEATHER ICON (Jacob) -->
            <img id="weatherIcon" src="" alt="Weather Icon">

            <!-- WEATHER DETAILS (James) -->
            <div class="mt-3">
                <p>Humidity: <span id="humidity">--</span>%</p>
                <p>Wind Speed: <span id="wind">--</span> mph</p>
            </div>
        </div>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- App JS -->
    <script src="app.js"></script>

</body>

</html>
